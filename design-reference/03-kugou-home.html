<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<title>KGPlayer 酷狗</title>
<script src="ee7aa0a4-0295-4ec4-b8b6-3c239e064791"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}button{font-family:inherit}
.nav{display:block;width:100%;text-align:left;padding:0 14px;height:40px;border:0;background:transparent;color:#5F5E58;font-size:14px;border-radius:10px;cursor:pointer}
.nav.on{background:#E4E1D5;color:#141413;font-weight:600}
.h{font-size:12px;color:#5F5E58;padding:0 14px;margin:24px 0 8px}
.sub{font-size:12px;color:#5F5E58}
.serif{font-family:'Noto Serif CJK SC','Source Han Serif SC','Songti SC',Georgia,serif}
.ib{width:44px;height:44px;border:0;background:transparent;color:#141413;display:grid;place-items:center;border-radius:22px;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:grid;grid-template-columns:1fr 160px 64px;align-items:center;height:56px;padding:0 14px;border-radius:12px;font-size:14px}
.row.on{background:#EFEDE4}
.t{display:flex;gap:12px;align-items:center}
.cv{width:40px;height:40px;border-radius:8px;flex:none}
.tile{display:flex;gap:12px;align-items:center;padding:12px;background:#F5F4ED;border:1px solid #E3E0D4;border-radius:14px}
</style>
</helmet>
<div style="width:1280px;height:800px;display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 88px;background:#FAF9F5;color:#141413;font-family:'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;overflow:hidden">

<aside style="background:#F0EEE6;padding:24px 12px;display:flex;flex-direction:column;box-sizing:border-box">
<div class="serif" style="font-size:22px;font-weight:500;padding:0 14px 24px">KGPlayer</div>
<button class="nav on">首页</button><button class="nav">每日推荐</button><button class="nav">播放历史</button>
<div class="h">云端歌单</div>
<button class="nav">我喜欢</button><button class="nav">通勤</button><button class="nav">深夜</button>
<div style="flex:1"></div>
<button class="nav">设置</button>
</aside>

<main style="padding:24px 32px 0;box-sizing:border-box;overflow:hidden">
<div style="display:flex;align-items:center;gap:16px">
<label style="flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;background:#fff;border:1px solid #DDD9CB;border-radius:22px;color:#5F5E58;box-sizing:border-box">
<svg class="i" width="18" height="18" sc-camel-view-box="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4-4"></path></svg>
<input placeholder="搜索酷狗曲库" style="flex:1;border:0;outline:0;background:transparent;color:#141413;font-size:14px;font-family:inherit">
</label>
<div style="display:flex;background:#EFEDE4;border-radius:22px;padding:4px">
<button style="height:36px;padding:0 18px;border:0;border-radius:18px;background:transparent;color:#5F5E58;font-size:13px;cursor:pointer">本地</button>
<button style="height:36px;padding:0 18px;border:0;border-radius:18px;background:#fff;color:#141413;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(20,20,19,.12)">酷狗</button>
</div>
<button style="height:44px;padding:0 20px;border:1px solid #DDD9CB;border-radius:22px;background:#fff;color:#141413;font-size:13px;cursor:pointer">已登录</button>
</div>

<div style="margin:28px 14px 20px"><h1 class="serif" style="margin:0;font-size:32px;font-weight:500">下午好</h1><div class="sub" style="margin-top:4px">酷狗 · 为你推荐</div></div>

<div style="display:grid;grid-template-columns:280px 1fr;gap:24px">
<div style="height:280px;border-radius:20px;background:#EBD3C3;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
<div><div class="serif" style="font-size:28px;font-weight:500">每日推荐</div><div style="font-size:13px;color:#5F5E58;margin-top:6px">每天更新</div></div>
<button style="align-self:flex-start;height:44px;padding:0 24px;border:0;border-radius:22px;background:#B85537;color:#fff;font-size:14px;font-weight:600;cursor:pointer">播放全部</button>
</div>
<div>
<div class="row on"><div class="t"><div class="cv" style="background:#D9B79D"></div><div><div style="color:#9E4326;font-weight:600">灯火阑珊</div><div class="sub">白河</div></div></div><span class="sub">旧街</span><span class="sub">4:05</span></div>
<div class="row"><div class="t"><div class="cv" style="background:#C8CFBF"></div><div><div>远山</div><div class="sub">周野</div></div></div><span class="sub">远行</span><span class="sub">4:51</span></div>
<div class="row"><div class="t"><div class="cv" style="background:#CFC6D8"></div><div><div>晨光</div><div class="sub">小满</div></div></div><span class="sub">日常</span><span class="sub">2:58</span></div>
<div class="row"><div class="t"><div class="cv" style="background:#BFD0D9"></div><div><div>夜谈</div><div class="sub">林间</div></div></div><span class="sub">夜谈</span><span class="sub">3:36</span></div>
<div class="row"><div class="t"><div class="cv" style="background:#E3C9B6"></div><div><div>回声</div><div class="sub">林间</div></div></div><span class="sub">潮汐之间</span><span class="sub">3:18</span></div>
</div>
</div>

<h2 class="serif" style="margin:28px 14px 12px;font-size:20px;font-weight:500">云端歌单</h2>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div class="tile"><div class="cv" style="width:56px;height:56px;background:#E3C9B6"></div><div><div style="font-size:14px;font-weight:600">我喜欢</div><div class="sub">酷狗账号</div></div></div>
<div class="tile"><div class="cv" style="width:56px;height:56px;background:#C8CFBF"></div><div><div style="font-size:14px;font-weight:600">通勤</div><div class="sub">酷狗账号</div></div></div>
<div class="tile"><div class="cv" style="width:56px;height:56px;background:#CFC6D8"></div><div><div style="font-size:14px;font-weight:600">深夜</div><div class="sub">酷狗账号</div></div></div>
<div class="tile"><div class="cv" style="width:56px;height:56px;background:#BFD0D9"></div><div><div style="font-size:14px;font-weight:600">跑步</div><div class="sub">酷狗账号</div></div></div>
</div>
</main>

<footer style="grid-column:1 / -1;background:#F5F4ED;border-top:1px solid #E3E0D4;display:grid;grid-template-columns:1fr 560px 1fr;align-items:center;padding:0 24px;box-sizing:border-box">
<div style="display:flex;gap:12px;align-items:center"><div style="width:56px;height:56px;border-radius:10px;background:#D9B79D"></div><div><div style="font-size:14px;font-weight:600">灯火阑珊</div><div class="sub">白河</div></div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
<div style="display:flex;align-items:center;gap:8px">
<button class="ib" aria-label="随机播放" style="color:#5F5E58"><svg class="i" width="20" height="20" sc-camel-view-box="0 0 24 24"><path d="M16 4h4v4M4 20L20 4M20 16v4h-4M4 4l5 5M15 15l5 5"></path></svg></button>
<button class="ib" aria-label="上一首"><svg class="i" width="22" height="22" sc-camel-view-box="0 0 24 24" style="fill:currentColor"><path d="M18 5v14l-9-7zM6 5v14"></path></svg></button>
<button class="ib" aria-label="暂停" style="width:48px;height:48px;border-radius:24px;background:#B85537;color:#fff"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zM14 5h3v14h-3z"></path></svg></button>
<button class="ib" aria-label="下一首"><svg class="i" width="22" height="22" sc-camel-view-box="0 0 24 24" style="fill:currentColor"><path d="M6 5v14l9-7zM18 5v14"></path></svg></button>
<button class="ib" aria-label="循环模式" style="color:#5F5E58"><svg class="i" width="20" height="20" sc-camel-view-box="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"></path></svg></button>
</div>
<div style="display:flex;align-items:center;gap:12px;width:100%"><span class="sub" style="width:36px;text-align:right">1:38</span><div style="flex:1;height:4px;background:#E3E0D4;border-radius:2px"><div style="width:40%;height:4px;background:#B85537;border-radius:2px"></div></div><span class="sub" style="width:36px">4:05</span></div>
</div>
<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">
<button class="ib" aria-label="播放队列"><svg class="i" width="20" height="20" sc-camel-view-box="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>
<svg class="i" width="20" height="20" sc-camel-view-box="0 0 24 24" style="color:#5F5E58"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6"></path></svg>
<div style="width:100px;height:4px;background:#E3E0D4;border-radius:2px"><div style="width:70%;height:4px;background:#141413;border-radius:2px"></div></div>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {

return {};
}
}
</script>


</body></html>
