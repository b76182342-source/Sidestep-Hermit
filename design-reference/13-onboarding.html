<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<title>KGPlayer 欢迎</title>
<script src="06b3a162-be98-4023-9c1c-a51064589190"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}button{font-family:inherit}
.sub{font-size:13px;color:#5F5E58;line-height:20px}
.serif{font-family:'Noto Serif CJK SC','Source Han Serif SC','Songti SC',Georgia,serif}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip{background:#F5F4ED;border:1px solid #E3E0D4;border-radius:16px;padding:16px 20px;font-size:14px;line-height:22px}
</style>
</helmet>
<div style="width:1280px;height:800px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAF9F5;color:#141413;font-family:'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;overflow:hidden">

<div style="width:88px;height:88px;border-radius:44px;background:#EBD3C3;color:#9E4326;display:grid;place-items:center">
<svg class="i" width="40" height="40" sc-camel-view-box="0 0 24 24"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
</div>
<h1 class="serif" style="margin:28px 0 12px;font-size:38px;font-weight:500">欢迎使用 KGPlayer</h1>
<p class="sub" style="margin:0 0 32px;font-size:15px;text-align:center;max-width:440px">选择你的音乐文件夹，我们会在后台扫描，扫描时你可以继续使用。</p>

<div style="display:flex;gap:12px">
<button style="height:48px;padding:0 32px;border:0;border-radius:24px;background:#B85537;color:#fff;font-size:15px;font-weight:600;cursor:pointer">选择音乐文件夹</button>
<button style="height:48px;padding:0 28px;border:1px solid #DDD9CB;border-radius:24px;background:#fff;color:#141413;font-size:15px;cursor:pointer">登录酷狗</button>
</div>

<div style="display:grid;grid-template-columns:repeat(3,260px);gap:16px;margin-top:56px">
<div class="tip">支持 mp3、flac、ogg、wav、m4a 等常见格式</div>
<div class="tip">文件夹里的变化会被自动发现</div>
<div class="tip">歌词会自动匹配同名的 .lrc 文件</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>


</body></html>
