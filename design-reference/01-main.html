<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<title>KGPlayer</title>
<script src="01bacd34-fea3-416c-855c-e3fc5824f61e"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit}
.nav{display:block;width:100%;text-align:left;padding:0 14px;height:40px;border:0;background:transparent;color:#5F5E58;font-size:14px;border-radius:10px;cursor:pointer}
.nav:hover{background:#E9E6DB;color:#141413}
.nav.on{background:#E4E1D5;color:#141413;font-weight:600}
.h{font-size:12px;color:#5F5E58;padding:0 14px;margin:24px 0 8px}
.row{display:grid;grid-template-columns:40px 1fr 200px 64px;align-items:center;height:56px;padding:0 14px;border-radius:12px;color:#141413;font-size:14px}
.row:hover{background:#F3F1EA}
.row.on{background:#EFEDE4}
.cv{width:40px;height:40px;border-radius:8px;flex:none}
.t{display:flex;gap:12px;align-items:center}
.sub{font-size:12px;color:#5F5E58}
.ib{width:44px;height:44px;border:0;background:transparent;color:#141413;display:grid;place-items:center;border-radius:22px;cursor:pointer}
.ib:hover{background:#E9E6DB}
.ln{font-size:15px;color:#5F5E58;line-height:40px}
.serif{font-family:'Noto Serif CJK SC','Source Han Serif SC','Songti SC',Georgia,serif}
</style>
</helmet>
<div style="width:1280px;height:800px;display:grid;grid-template-columns:220px 1fr 340px;grid-template-rows:1fr 88px;background:#FAF9F5;color:#141413;font-family:'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;overflow:hidden">

<aside style="background:#F0EEE6;padding:24px 12px;display:flex;flex-direction:column;box-sizing:border-box">
<div class="serif" style="font-size:22px;font-weight:500;padding:0 14px 24px">KGPlayer</div>
<button class="nav on">全部歌曲</button>
<button class="nav">专辑</button>
<button class="nav">艺术家</button>
<div class="h">歌单</div>
<button class="nav">我喜欢</button>
<button class="nav">通勤</button>
<button class="nav">深夜</button>
<div style="flex:1"></div>
<button class="nav">扫描音乐库</button>
<button class="nav">设置</button>
</aside>

<main style="padding:24px 32px 0;box-sizing:border-box;overflow:hidden">
<div style="display:flex;align-items:center;gap:16px">
<label style="flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;background:#FFFFFF;border:1px solid #DDD9CB;border-radius:22px;color:#5F5E58;box-sizing:border-box">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4-4"></path></svg>
<input placeholder="搜索歌曲、专辑、艺术家" style="flex:1;border:0;outline:0;background:transparent;color:#141413;font-size:14px;font-family:inherit">
</label>
<div style="display:flex;background:#EFEDE4;border-radius:22px;padding:4px">
<button style="height:36px;padding:0 18px;border:0;border-radius:18px;background:#FFFFFF;color:#141413;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(20,20,19,.12)">本地</button>
<button style="height:36px;padding:0 18px;border:0;border-radius:18px;background:transparent;color:#5F5E58;font-size:13px;cursor:pointer">酷狗</button>
</div>
<button style="height:44px;padding:0 20px;border:0;border-radius:22px;background:#141413;color:#FAF9F5;font-size:13px;font-weight:600;cursor:pointer">登录</button>
</div>

<div style="display:flex;align-items:baseline;gap:12px;margin:32px 0 16px;padding:0 14px">
<h1 class="serif" style="margin:0;font-size:32px;font-weight:500">全部歌曲</h1>
<span class="sub">本地 · 示例数据</span>
</div>

<div class="row" style="height:36px;color:#5F5E58;font-size:12px;border-bottom:1px solid #E3E0D4;border-radius:0"><span>#</span><span>标题</span><span>专辑</span><span>时长</span></div>

<div class="row"><span class="sub">1</span><div class="t"><div class="cv" style="background:#E3C9B6"></div><div><div>夜航船</div><div class="sub">林间</div></div></div><span class="sub">潮汐之间</span><span class="sub">3:42</span></div>
<div class="row on"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="#9E4326"><rect x="1" y="5" width="3" height="8" rx="1"></rect><rect x="5.5" y="1" width="3" height="12" rx="1"></rect><rect x="10" y="7" width="3" height="6" rx="1"></rect></svg><div class="t"><div class="cv" style="background:#D9B79D"></div><div><div style="color:#9E4326;font-weight:600">灯火阑珊</div><div class="sub">白河</div></div></div><span class="sub">旧街</span><span class="sub">4:05</span></div>
<div class="row"><span class="sub">3</span><div class="t"><div class="cv" style="background:#E3C9B6"></div><div><div>回声</div><div class="sub">林间</div></div></div><span class="sub">潮汐之间</span><span class="sub">3:18</span></div>
<div class="row"><span class="sub">4</span><div class="t"><div class="cv" style="background:#C8CFBF"></div><div><div>远山</div><div class="sub">周野</div></div></div><span class="sub">远行</span><span class="sub">4:51</span></div>
<div class="row"><span class="sub">5</span><div class="t"><div class="cv" style="background:#D9B79D"></div><div><div>雨后</div><div class="sub">白河</div></div></div><span class="sub">旧街</span><span class="sub">3:27</span></div>
<div class="row"><span class="sub">6</span><div class="t"><div class="cv" style="background:#C8CFBF"></div><div><div>慢车</div><div class="sub">周野</div></div></div><span class="sub">远行</span><span class="sub">5:02</span></div>
<div class="row"><span class="sub">7</span><div class="t"><div class="cv" style="background:#CFC6D8"></div><div><div>晨光</div><div class="sub">小满</div></div></div><span class="sub">日常</span><span class="sub">2:58</span></div>
<div class="row"><span class="sub">8</span><div class="t"><div class="cv" style="background:#CFC6D8"></div><div><div>无人区</div><div class="sub">小满</div></div></div><span class="sub">日常</span><span class="sub">4:14</span></div>
</main>

<section style="background:#F5F4ED;border-left:1px solid #E3E0D4;padding:24px;box-sizing:border-box;overflow:hidden">
<div style="width:292px;height:292px;border-radius:16px;background:#D9B79D"></div>
<div class="serif" style="margin-top:20px;font-size:22px;font-weight:500">灯火阑珊</div>
<div class="sub" style="margin-top:4px;font-size:13px">白河 · 旧街</div>
<div style="margin-top:20px;display:flex;flex-direction:column">
<div class="ln">街角的灯一盏盏亮起</div>
<div class="ln">雨停在最后一班车之前</div>
<div class="ln serif" style="color:#9E4326;font-size:19px;font-weight:600">我把脚步放得很轻很轻</div>
<div class="ln">像怕惊动这座城市</div>
<div class="ln">走过的路都慢慢变暗</div>
</div>
</section>

<footer style="grid-column:1 / -1;background:#F5F4ED;border-top:1px solid #E3E0D4;display:grid;grid-template-columns:1fr 560px 1fr;align-items:center;padding:0 24px;box-sizing:border-box">
<div class="t"><div class="cv" style="width:56px;height:56px;background:#D9B79D;border-radius:10px"></div><div><div style="font-size:14px;font-weight:600">灯火阑珊</div><div class="sub">白河</div></div></div>

<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
<div style="display:flex;align-items:center;gap:8px">
<button class="ib" aria-label="随机播放" style="color:#5F5E58"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M4 20L20 4M20 16v4h-4M4 4l5 5M15 15l5 5"></path></svg></button>
<button class="ib" aria-label="上一首"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 5v14l-9-7z"></path><path d="M6 5v14"></path></svg></button>
<button class="ib" aria-label="暂停" style="width:48px;height:48px;border-radius:24px;background:#B85537;color:#FFFFFF"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
<button class="ib" aria-label="下一首"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 5v14l9-7z"></path><path d="M18 5v14"></path></svg></button>
<button class="ib" aria-label="循环模式" style="color:#5F5E58"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"></path></svg></button>
</div>
<div style="display:flex;align-items:center;gap:12px;width:100%">
<span class="sub" style="width:36px;text-align:right">1:38</span>
<div style="flex:1;height:4px;background:#E3E0D4;border-radius:2px"><div style="width:40%;height:4px;background:#B85537;border-radius:2px"></div></div>
<span class="sub" style="width:36px">4:05</span>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">
<button class="ib" aria-label="播放队列"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5F5E58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 010 6"></path></svg>
<div style="width:100px;height:4px;background:#E3E0D4;border-radius:2px"><div style="width:70%;height:4px;background:#141413;border-radius:2px"></div></div>
</div>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>


</body></html>
