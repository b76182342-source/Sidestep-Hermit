# 仅使用 stable 可用的选项。
# 注意：wrap_comments / comment_width / normalize_comments / format_code_in_doc_comments
# 都是 nightly-only，写在 stable 上会被忽略并刷一屏警告，故不启用。
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
edition = "2021"
merge_derives = true
use_try_shorthand = true
use_field_init_shorthand = true
force_explicit_abi = true
